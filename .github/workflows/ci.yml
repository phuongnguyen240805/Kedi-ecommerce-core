name: CI — Typecheck & Lint
permissions:
  contents: read
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  commerce-tests:
    name: Commerce, store isolation and operations UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:commerce --workspace merchant
      - run: npm run test:shipping --workspace merchant
      - run: npm run test:shipping:workflow --workspace merchant
      - run: npm run test:stores --workspace merchant
      - run: npm run test:commerce:ui --workspace client

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspaces --if-present
