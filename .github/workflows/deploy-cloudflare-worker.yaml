name: CloudflareWorkerDeploy

on:
  push:
    branches:
      - main
    paths:
      - apps/merchant/**
      - package-lock.json
      - .github/workflows/deploy-cloudflare-worker.yaml
      - .github/workflows/create-env-artifact.yaml
      - scripts/generate-wrangler-jsonc.py

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write
  attestations: write

jobs:
  deployment-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate deployment credentials before creating artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRYPTOKEN: ${{ secrets.CRYPTOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          test "${#CRYPTOKEN}" -ge 32 || { echo 'CRYPTOKEN must be configured with at least 32 characters'; exit 1; }

      - uses: actions/checkout@v4
      - name: Verify Cloudflare account authorization (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/verify-cloudflare-deploy.py

  commerce-quality:
    uses: ./.github/workflows/commerce-quality.yml

  create-env:
    needs: deployment-config
    uses: ./.github/workflows/create-env-artifact.yaml
    secrets: inherit

  build:
    needs: [create-env, commerce-quality]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"


      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: |
          npm install

      - name: Download shared .env artifact
        uses: actions/download-artifact@v5
        with:
          name: shared-env
          path: .

      # .env.enc was encrypted with openssl enc -aes-256-cbc -salt -in env_and_wrangler.tar.gz -out .env.enc -iter 10000 -pass pass:"${{ secrets.CRYPTOKEN }}"
      # Decrypt it using the same key and parameters
      - name: Decrypt .env + wrangler.jsonc artifact
        env:
          CRYPTOKEN: ${{ secrets.CRYPTOKEN }}
        run: |
          openssl enc -aes-256-cbc -d -salt -in .env.enc -out env_and_wrangler.tar.gz -iter 10000 -pass env:CRYPTOKEN
          tar -xzvf env_and_wrangler.tar.gz
          rm env_and_wrangler.tar.gz .env.enc
          if [ ! -f .env ]; then
            echo "Decrypted artifact does not contain .env"
            exit 1
          fi
          if [ ! -f apps/merchant/wrangler.jsonc ]; then
            echo "Decrypted artifact does not contain apps/merchant/wrangler.jsonc"
            exit 1
          fi
          if ! grep -q "AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}" .env; then
            echo "Decrypted .env file does not contain expected AUTH0_DOMAIN value"
            exit 1
          fi

      - name: Reuse existing KV namespace after interrupted deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/resolve-deploy-kv.py apps/merchant/wrangler.jsonc

      - name: Set Wrangler secrets in bulk from secrets.json
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Check if secrets.json exists and is valid JSON
          if [ ! -f apps/merchant/secrets.json ]; then
            echo "secrets.json file not found in decrypted artifact"
            exit 1
          fi
          cd apps/merchant
          npx wrangler secret bulk < secrets.json

          
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/merchant

      - name: Verify deployed UCP discovery and catalog
        run: |
          curl --fail --silent --show-error --max-time 30 'https://merchant.gofiber-phuongnguyen.workers.dev/.well-known/ucp?deployment_probe=${{ github.sha }}' -o /dev/null
          curl --fail --silent --show-error --max-time 30 'https://merchant.gofiber-phuongnguyen.workers.dev/ucp/v1/products?deployment_probe=${{ github.sha }}' -o /dev/null

      - name: Upload ai.json.enc to KV_CACHE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -f ai.json.enc ]; then
            echo "Warning: ai.json.enc not found. Skipping KV upload."
            exit 0
          fi
          cd apps/merchant
          npx wrangler kv key put --path ../../ai.json.enc --binding KV_CACHE --remote ai:config
          echo "✓ ai.json.enc uploaded to KV_CACHE"
